version: 2
updates:
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  # With package-lock.json tracked, a release inside a declared range also gets
  # a pull request, and every merge makes the other open ones conflict on the
  # lockfile. Batch minor and patch bumps into one pull request; majors and
  # security updates still arrive one per pull request.
  groups:
    npm-minor-and-patch:
      applies-to: version-updates
      update-types:
      - minor
      - patch
  ignore:
  - dependency-name: semver
    versions:
    - 7.3.4
  - dependency-name: style-loader
    versions:
    - 1.2.1
  - dependency-name: express-validator
    versions:
    - 6.9.2
