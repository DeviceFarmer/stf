name: Docker build

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
      tag:
        type: string
        required: true
      push:
        type: boolean
        required: false
        default: false

env:
  IMAGE: devicefarmer/stf

jobs:
  build:
    name: Standard image (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    env:
      SECURITY_UPDATES_REFRESH: ${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: docker/setup-buildx-action@v4

      - name: Build the runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: SECURITY_UPDATES_REFRESH=${{ env.SECURITY_UPDATES_REFRESH }}
          load: true
          tags: stf-runtime-check:${{ matrix.arch }}
          provenance: false
          cache-from: type=gha,scope=stf-runtime-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=stf-runtime-${{ matrix.arch }},ignore-error=true

      - name: Load the Node base for the npmrc check
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          target: node-base
          load: true
          tags: stf-node-base-check:${{ matrix.arch }}
          provenance: false
          cache-from: type=gha,scope=stf-runtime-${{ matrix.arch }}

      - name: Check optional npm configuration secrets
        timeout-minutes: 5
        run: |
          python3 .github/scripts/docker-npmrc-smoke.py \
            --image stf-node-base-check:${{ matrix.arch }} --platform linux/${{ matrix.arch }} \
            --output "$RUNNER_TEMP/docker-npmrc-${{ matrix.arch }}.json"

      - name: Fetch the Android app bundle fixture
        if: matrix.arch == 'amd64'
        env:
          FIXTURE: ${{ runner.temp }}/runtime-fixtures/install-time-permanent-modules.aab
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$FIXTURE")"
          curl --fail --location --retry 3 --output "$FIXTURE" \
            https://raw.githubusercontent.com/google/bundletool/24df0e8b56580cef68ba904b3a80e881f4fc641a/src/test/resources/com/android/tools/build/bundletool/testdata/bundle/install-time-permanent-modules.aab
          printf '%s  %s\n' 83d7d10b6036da2f94ad34483a5c3d5a32891b08e4fd1a658165c55258bdaff2 "$FIXTURE" | sha256sum --check

      - name: Check the final runtime without a device
        timeout-minutes: 5
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime-fixtures"
          arguments=()
          if [ "$ARCH" = amd64 ]; then
            arguments+=(--aab /tmp/fixtures/install-time-permanent-modules.aab)
          fi
          docker run --rm --network none --platform "linux/$ARCH" \
            --mount "type=bind,src=$PWD/.github/scripts/docker-runtime-smoke.mjs,dst=/tmp/runtime-smoke.mjs,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/runtime-fixtures,dst=/tmp/fixtures,readonly" \
            "stf-runtime-check:$ARCH" node /tmp/runtime-smoke.mjs "${arguments[@]}" \
            | tee "$RUNNER_TEMP/docker-runtime-$ARCH.json"
          docker run --rm --network none --platform "linux/$ARCH" --user 1000:1000 \
            --cap-drop ALL --security-opt no-new-privileges \
            "stf-runtime-check:$ARCH" stf ios-provider --help

      - name: Check the amd64 Compose core
        if: matrix.arch == 'amd64'
        timeout-minutes: 10
        run: |
          python3 .github/scripts/docker-compose-smoke.py \
            --image stf-runtime-check:amd64 \
            --directory "$RUNNER_TEMP/docker-compose-runtime" --port 17100

      - name: Save runtime results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-runtime-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/docker-runtime-${{ matrix.arch }}.json
            ${{ runner.temp }}/docker-npmrc-${{ matrix.arch }}.json
            ${{ runner.temp }}/docker-compose-runtime/
          if-no-files-found: ignore
          retention-days: 7

      - name: Record the checked config digest
        id: checked-config
        if: inputs.push
        env:
          CHECKED_IMAGE: stf-runtime-check:${{ matrix.arch }}
        run: |
          set -euo pipefail
          archive=$(mktemp "$RUNNER_TEMP/stf-runtime.XXXXXX")
          trap 'rm -f -- "$archive"' EXIT
          # Docker's image ID depends on the image store. Hash the config itself.
          docker image save --output "$archive" "$CHECKED_IMAGE"
          config=$(tar -xOf "$archive" manifest.json | jq -er '
            if length == 1 then .[0].Config else error("Expected one checked image") end
            | strings | select(length > 0)
          ')
          checksum=$(tar -xOf "$archive" -- "$config" | sha256sum)
          printf 'digest=sha256:%s\n' "${checksum%% *}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: inputs.push
        uses: docker/login-action@v4
        with:
          username: devicefarmer
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}

      - name: Build and push the runtime image by digest
        id: publish
        if: inputs.push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: SECURITY_UPDATES_REFRESH=${{ env.SECURITY_UPDATES_REFRESH }}
          outputs: ${{ format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) }}
          cache-from: type=gha,scope=stf-runtime-${{ matrix.arch }}

      - name: Verify and export the published digest
        if: inputs.push
        run: |
          set -euo pipefail
          digest_pattern='^sha256:[0-9a-f]{64}$'
          if [[ ! "$CHECKED_CONFIG_DIGEST" =~ $digest_pattern || ! "$DIGEST" =~ $digest_pattern ]]; then
            echo 'Missing or invalid runtime build digest' >&2
            exit 1
          fi

          manifest=$(docker buildx imagetools inspect --raw "$IMAGE@$DIGEST")
          if jq -e 'has("manifests")' <<< "$manifest" > /dev/null; then
            platform_digest=$(jq -er --arg arch "$ARCH" '
              [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch)]
              | if length == 1 then .[0].digest else error("Expected one linux/" + $arch + " image") end
            ' <<< "$manifest")
            if [[ ! "$platform_digest" =~ $digest_pattern ]]; then
              echo 'Invalid platform manifest digest' >&2
              exit 1
            fi
            manifest=$(docker buildx imagetools inspect --raw "$IMAGE@$platform_digest")
          fi

          actual=$(jq -er '.config.digest' <<< "$manifest")
          if [[ "$actual" != "$CHECKED_CONFIG_DIGEST" ]]; then
            echo "Published linux/$ARCH config $actual differs from checked config $CHECKED_CONFIG_DIGEST" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          ARCH: ${{ matrix.arch }}
          CHECKED_CONFIG_DIGEST: ${{ steps.checked-config.outputs.digest }}
          DIGEST: ${{ steps.publish.outputs.digest }}

      - name: Upload the digest
        if: inputs.push
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Push the multi-arch manifest
    needs: build
    if: inputs.push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the amd64 digest
        uses: actions/download-artifact@v8
        with:
          name: digest-amd64
          path: ${{ runner.temp }}/digests/digest-amd64

      - name: Download the arm64 digest
        uses: actions/download-artifact@v8
        with:
          name: digest-arm64
          path: ${{ runner.temp }}/digests/digest-arm64

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: devicefarmer
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}

      - name: Create and push the manifest
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob
          sources=()
          for arch in amd64 arm64; do
            files=("$RUNNER_TEMP/digests/digest-$arch/"*)
            if (( ${#files[@]} != 1 )) || [[ ! -f "${files[0]}" ]]; then
              echo "Expected one verified digest file for linux/$arch" >&2
              exit 1
            fi
            sources+=("$IMAGE@sha256:${files[0]##*/}")
          done
          docker buildx imagetools create -t "$IMAGE:$TAG" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$TAG"
