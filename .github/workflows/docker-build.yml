name: Docker build

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
      tag:
        type: string
        required: true
      push:
        type: boolean
        required: false
        default: false

env:
  IMAGE: devicefarmer/stf

jobs:
  build:
    name: Standard image (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: inputs.push
        uses: docker/login-action@v4
        with:
          username: devicefarmer
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}

      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: ${{ inputs.push
            && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE)
            || 'type=cacheonly' }}

      - name: Export the digest
        if: inputs.push
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload the digest
        if: inputs.push
        uses: actions/upload-artifact@v6
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Push the multi-arch manifest
    needs: build
    if: inputs.push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: devicefarmer
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}

      - name: Create and push the manifest
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          cd /tmp/digests
          docker buildx imagetools create -t "$IMAGE:$TAG" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$TAG"
