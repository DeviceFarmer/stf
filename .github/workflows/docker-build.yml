name: Docker build

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
      tag:
        type: string
        required: true
      push:
        type: boolean
        required: false
        default: false

env:
  IMAGE: devicefarmer/stf

jobs:
  build:
    name: Standard image (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: docker/setup-buildx-action@v4

      - name: Build the runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: stf-runtime-check:${{ matrix.arch }}
          provenance: false
          cache-from: type=gha,scope=stf-runtime-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=stf-runtime-${{ matrix.arch }}

      - name: Fetch the Android app bundle fixture
        if: matrix.arch == 'amd64'
        env:
          FIXTURE: ${{ runner.temp }}/runtime-fixtures/install-time-permanent-modules.aab
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$FIXTURE")"
          curl --fail --location --retry 3 --output "$FIXTURE" \
            https://raw.githubusercontent.com/google/bundletool/24df0e8b56580cef68ba904b3a80e881f4fc641a/src/test/resources/com/android/tools/build/bundletool/testdata/bundle/install-time-permanent-modules.aab
          printf '%s  %s\n' 83d7d10b6036da2f94ad34483a5c3d5a32891b08e4fd1a658165c55258bdaff2 "$FIXTURE" | sha256sum --check

      - name: Check the final runtime without a device
        timeout-minutes: 5
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime-fixtures"
          arguments=()
          if [ "$ARCH" = amd64 ]; then
            arguments+=(--aab /tmp/fixtures/install-time-permanent-modules.aab)
          fi
          docker run --rm --network none --platform "linux/$ARCH" \
            --mount "type=bind,src=$PWD/.github/scripts/docker-runtime-smoke.mjs,dst=/tmp/runtime-smoke.mjs,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/runtime-fixtures,dst=/tmp/fixtures,readonly" \
            "stf-runtime-check:$ARCH" node /tmp/runtime-smoke.mjs "${arguments[@]}" \
            | tee "$RUNNER_TEMP/docker-runtime-$ARCH.json"

      - name: Check the amd64 Compose core
        if: matrix.arch == 'amd64'
        timeout-minutes: 10
        run: |
          python3 .github/scripts/docker-compose-smoke.py \
            --image stf-runtime-check:amd64 \
            --directory "$RUNNER_TEMP/docker-compose-runtime" --port 17100

      - name: Save runtime results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-runtime-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/docker-runtime-${{ matrix.arch }}.json
            ${{ runner.temp }}/docker-compose-runtime/
          if-no-files-found: ignore
          retention-days: 7

      - name: Log in to Docker Hub
        if: inputs.push
        uses: docker/login-action@v4
        with:
          username: devicefarmer
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}

      - name: Publish the checked image
        id: publish
        if: inputs.push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: ${{ format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) }}
          cache-from: type=gha,scope=stf-runtime-${{ matrix.arch }}

      - name: Export the digest
        if: inputs.push
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}

      - name: Upload the digest
        if: inputs.push
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Push the multi-arch manifest
    needs: build
    if: inputs.push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: devicefarmer
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}

      - name: Create and push the manifest
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          cd /tmp/digests
          docker buildx imagetools create -t "$IMAGE:$TAG" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$TAG"
